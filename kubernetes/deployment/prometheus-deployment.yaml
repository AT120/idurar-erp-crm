apiVersion: v1
kind: Service
metadata:
    name: prometheus
spec:
    type: ClusterIP
    selector:
        app: prometheus 
    ports:
      - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: prometheus
spec:
    selector:
        matchLabels:
            app: prometheus
    replicas: 1
    template:
        metadata:
            labels:
                app: prometheus
        spec:
            serviceAccountName: prometheus-account
            containers:
              - name: prometheus
                image: prom/prometheus:v2.53.0
                args:
                  - "--config.file=/etc/prometheus/prometheus.yml"
                  - "--storage.tsdb.path=/prometheus/"
                ports:
                  - containerPort: 9090
                volumeMounts:
                  - name: prometheus-storage-volume
                    mountPath: /prometheus
                  - name: prometheus-config-volume
                    mountPath: /etc/prometheus
            volumes:
              - name: prometheus-config-volume
                configMap:
                    name: prometheus-config
                    items:
                      - key: prometheus.yml
                        path: prometheus.yml
              - name: prometheus-storage-volume
                persistentVolumeClaim:
                    claimName: prometheus-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: prometheus-storage
spec:
    accessModes:
      - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
data:
    prometheus.yml: |
        global:
          scrape_interval: 15s
          evaluation_interval: 15s 

        scrape_configs:
          - job_name: 'idurar-backend'
            kubernetes_sd_configs:
                - role: endpointslice
            metrics_path: '/metrics'
            relabel_configs:
              - source_labels: [__meta_kubernetes_endpointslice_name]
                action: keep
                regex: idurar-backend(.*)
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: prometheus-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: prometheus-role
rules:
  - resources: [nodes, services, endpoints, pods]
    apiGroups: [""]
    verbs: [get, list, watch]
  - resources: [endpointslices]
    apiGroups: ["discovery.k8s.io"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: prometheus
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: prometheus-role
subjects:
  - kind: ServiceAccount
    name: prometheus-account
    namespace: default

